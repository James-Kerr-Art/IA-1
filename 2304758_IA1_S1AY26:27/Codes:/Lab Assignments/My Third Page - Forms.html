<!DOCTYPE html>
<html>
    <head>
        <title></title>
    </head>
    <body>
        <form name="f1" action="test.aspx" method="get/post">
            <fieldset>
                <legend>Student info</legend>
            <label>Student Name : </label>
            <input type="text" name="tb1" maxlength="6" minlength="3" placeholder="Type your fullname" required/> <br/><br/>

            <label>Student ID# : </label>
            <input type="number" name="tb2" maxlength="6" minlength="3" placeholder="Type your ID#" required/> <br/><br/>

            <label>Student Password : </label>
            <input type="password" name="tb3" maxlength="6" minlength="3" placeholder="Type your Password" required/> <br/><br/>

            <label>Student Email : </label>
            <input type="email" name="tb4" maxlength="6" minlength="3" placeholder="Type your email" required/> <br/><br/>

            <label>Student DOB : </label>
            <input type="date" name="tb5"> <br/><br/>
            <input type="month" name="tb5">
            <input type="tel" name="tb5" placeholder="Telephone">
            <input type="time" name="tb5">
            <input type="file" name="tb5">
            </fieldset>
<br/><br/>
            <fieldset>
            <label>Student Gender : </label> 
            <input type="radio" name="tb6" /> Male
            <input type="radio" name="tb6" /> Female
<br/><br/>
            <label>Student Semester : </label> 
            <input type="radio" name="tb7" /> Sem 1 
            <input type="radio" name="tb7" /> Sem 2
            </fieldset>
<br/><br/>
            <fieldset>
                <legend>Module Selection</legend>
            <label>Select your modules : </label> 
            <input type="checkbox" name="tb8" /> C++
            <input type="checkbox" name="tb9" /> Web Programming
            <input type="checkbox" name="tb10" /> Java
<br/><br/>
            <Label> Select your Major: </Label>
            <select>
                <option> Animation </option>
                <option> Data Analysis </option>
                <option> A.I. </option>
                <option> Digital Marketing</option>
            </select>
<br/><br/>
            <label> Type your comments: </label>
            <textarea name="ta" cols="30" rows="9"></textarea>
            </fieldset>
<br/><br/>
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
            <input type="button" value="Call JS" />
        </form>
    </body>
</html>
